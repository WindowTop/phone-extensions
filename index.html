<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WindowTop Phone Extensions</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>WindowTop Phone Extensions</h1>
  <p>Android apps that extend WindowTop widgets on your PC.</p>
  <input id="search" type="search" placeholder="Search extensions..." autofocus>
  <div id="categories"></div>
</header>
<main>
  <div id="list"></div>
  <p id="empty" hidden>No extensions found.</p>
</main>
<footer>
  <p>Downloads are signed APK files. Android may ask you to allow installing from this source.</p>
</footer>
<script src="extensions.js"></script>
<script src="app.js"></script>
</body>
</html>
